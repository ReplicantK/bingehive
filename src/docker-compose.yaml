name: bingehive

services:
  db:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL_PASS}
      MYSQL_DATABASE: ${SQL_DB_NAME}
    ports:
      - "3600:3600"

  blob:
    container_name: blob-storage-bh
    restart: unless-stopped
    image: "minio/minio:latest"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${BLOB_USER}
      MINIO_ROOT_PASSWORD: ${BLOB_PASS}
    volumes:
      - ${BLOB_LOCATION}:/data
    command: server /data --console-address ":9001"

  web:
    container_name: web-bh
    restart: unless-stopped
    build: .
    ports:
      - "3000:3000"
